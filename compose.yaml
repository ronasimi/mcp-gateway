services:
  mcp-gateway:
    build:
      context: .
      args:
        SEARXNG_REF: ${SEARXNG_REF:-12f8b6515}
    image: local/agent-mcp-stack:latest
    container_name: mcp-gateway
    restart: unless-stopped

    environment:
      # Used as the durable SearXNG secret on first initialization.
      MCP_GATEWAY_AUTH_TOKEN: ${MCP_GATEWAY_AUTH_TOKEN:-}
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}

      PLAYWRIGHT_MCP_PORT: 8931
      PLAYWRIGHT_MCP_USER_DATA_DIR: /data/playwright
      PLAYWRIGHT_MCP_IDLE_TIMEOUT: ${PLAYWRIGHT_MCP_IDLE_TIMEOUT:-300000}

      MEMORY_MCP_PORT: 8932
      MEMORY_FILE_PATH: /data/memory/memory.jsonl

    # Host-native agents use loopback; containers on ai-local use the service name.
    ports:
      - "127.0.0.1:${MCP_GATEWAY_PORT:-8888}:8888"
      - "127.0.0.1:${PLAYWRIGHT_HOST_PORT:-8931}:8931"
      - "127.0.0.1:${MEMORY_HOST_PORT:-8932}:8932"

    volumes:
      - ./data/searxng:/etc/searxng
      - ./data/playwright:/data/playwright
      - ./data/memory:/data/memory

    mem_limit: ${MCP_GATEWAY_MEMORY:-1536m}
    cpus: ${MCP_GATEWAY_CPUS:-2.0}
    shm_size: ${PLAYWRIGHT_SHM_SIZE:-512m}

    security_opt:
      - no-new-privileges:true

    networks:
      - ai-local

networks:
  ai-local:
    external: true
    name: ai-local
