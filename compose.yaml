services:
  # Upstream self-contained SearXNG + MCP image, exposed directly.
  # Avoid placing another HTTP reverse proxy in front of it: the upstream image
  # already multiplexes the Web UI and /mcp/ on port 8888.
  mcp-searxng:
    image: ${SEARXNG_IMAGE:-ghcr.io/whw23/searxng-http-mcp:latest}
    container_name: mcp-searxng
    restart: unless-stopped
    pull_policy: always

    environment:
      # Explicitly configure this as a private/local instance. The generated
      # settings.yml contains the same values; env overrides make upgrades safe.
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      SEARXNG_METHOD: "GET"

    ports:
      - "127.0.0.1:${MCP_GATEWAY_PORT:-8888}:8888"

    volumes:
      - ./data/searxng:/etc/searxng

    mem_limit: ${SEARXNG_MEMORY:-512m}
    cpus: ${SEARXNG_CPUS:-1.0}

    security_opt:
      - no-new-privileges:true

    networks:
      - ai-local

  # Playwright + Memory MCP services. SearXNG is intentionally NOT proxied
  # through this container; clients connect to mcp-searxng:8888 directly.
  mcp-gateway:
    build:
      context: .
      dockerfile: Dockerfile.tools
      args:
        PLAYWRIGHT_MCP_VERSION: ${PLAYWRIGHT_MCP_VERSION:-0.0.83}
        MEMORY_MCP_VERSION: ${MEMORY_MCP_VERSION:-2026.8.31}
        SUPERGATEWAY_VERSION: ${SUPERGATEWAY_VERSION:-4.0.0}
    image: local/agent-mcp-tools:latest
    container_name: mcp-gateway
    restart: unless-stopped

    environment:
      PLAYWRIGHT_MCP_PORT: 8931
      PLAYWRIGHT_MCP_EXECUTABLE_PATH: /usr/bin/chromium
      PLAYWRIGHT_MCP_USER_DATA_DIR: /data/playwright
      PLAYWRIGHT_MCP_IDLE_TIMEOUT: ${PLAYWRIGHT_MCP_IDLE_TIMEOUT:-300000}
      PLAYWRIGHT_MCP_PING_TIMEOUT_MS: ${PLAYWRIGHT_MCP_PING_TIMEOUT_MS:-30000}
      PLAYWRIGHT_MCP_SHARED_BROWSER_CONTEXT: ${PLAYWRIGHT_MCP_SHARED_BROWSER_CONTEXT:-true}

      MEMORY_MCP_PORT: 8932
      MEMORY_FILE_PATH: /data/memory/memory.jsonl

    ports:
      - "127.0.0.1:${PLAYWRIGHT_HOST_PORT:-8931}:8931"
      - "127.0.0.1:${MEMORY_HOST_PORT:-8932}:8932"

    volumes:
      - ./data/playwright:/data/playwright
      - ./data/memory:/data/memory

    mem_limit: ${MCP_GATEWAY_MEMORY:-1024m}
    cpus: ${MCP_GATEWAY_CPUS:-1.5}
    shm_size: ${PLAYWRIGHT_SHM_SIZE:-512m}

    security_opt:
      - no-new-privileges:true

    networks:
      - ai-local

networks:
  ai-local:
    external: true
    name: ai-local
